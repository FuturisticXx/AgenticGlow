name: AgenticGlow
options:
  createIntermediateGroups: true
  bundleIdPrefix: com.twodamax
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "6.0"
    CLANG_ENABLE_MODULES: YES
    ONLY_ACTIVE_ARCH: NO
targets:
  AgenticGlowCore:
    type: framework
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Sources/AgenticGlowCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twodamax.agenticglow.core
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES
        MACH_O_TYPE: staticlib
  AgenticGlowEvent:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Sources/AgenticGlowEvent
    dependencies:
      - target: AgenticGlowCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twodamax.agenticglow.event
        PRODUCT_NAME: agenticglow-event
        # The helper ships inside the app bundle (see the app's embed
        # script), never as a standalone install. Without this an archive
        # also installs it to usr/local/bin, which turns the archive into
        # a generic one that Xcode refuses to export as an application.
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@loader_path"
          - "@loader_path/../Frameworks"
          - "@loader_path/../../Frameworks"
          - "@executable_path/../Frameworks"
      configs:
        Debug:
          DEVELOPMENT_TEAM: Z52AX2BH7T
  AgenticGlowWidget:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Sources/AgenticGlowWidget
    info:
      path: Config/AgenticGlowWidget-Info.plist
      properties:
        CFBundleDisplayName: AgenticGlow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: Copyright © 2026 AgenticGlow contributors
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/AgenticGlowWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - Z52AX2BH7T.group.com.twodamax.agenticglow
    dependencies:
      - target: AgenticGlowCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twodamax.agenticglow.widget
        PRODUCT_NAME: AgenticGlowWidget
        GENERATE_INFOPLIST_FILE: NO
        REGISTER_APP_GROUPS: YES
        SKIP_INSTALL: YES
      configs:
        Debug:
          DEVELOPMENT_TEAM: Z52AX2BH7T
  AgenticGlow:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Sources/AgenticGlowApp
    resources:
      - Sources/AgenticGlowApp/Resources
    info:
      path: Config/AgenticGlow-Info.plist
      properties:
        CFBundleDisplayName: AgenticGlow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSAppleEventsUsageDescription: AgenticGlow asks Codex to bring the window for a session you click to the front, and asks Messages to send the usage reset alerts you turn on in Settings.
        NSHumanReadableCopyright: Copyright © 2026 AgenticGlow contributors
        CFBundleURLTypes:
          - CFBundleURLName: com.twodamax.agenticglow
            CFBundleURLSchemes:
              - agenticglow
    entitlements:
      path: Config/AgenticGlow.entitlements
      properties:
        com.apple.security.application-groups:
          - Z52AX2BH7T.group.com.twodamax.agenticglow
        # Hardened Runtime blocks Apple Events without this. It grants
        # nothing on its own: macOS still asks the user to approve each
        # target app individually under Privacy & Security, Automation.
        # Used for raising a Codex window and for Messages reset alerts.
        com.apple.security.automation.apple-events: true
        # Publishes the widget snapshot to the user's private CloudKit
        # database for the iPhone widget, only when "Sync to the iPhone
        # widget" is on. The publisher checks for this entitlement at
        # runtime and stays inert in a build signed without it.
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.twodamax.agenticglow
        com.apple.developer.icloud-services:
          - CloudKit
    dependencies:
      - target: AgenticGlowCore
      - target: AgenticGlowEvent
        embed: false
      - target: AgenticGlowWidget
        embed: true
    postBuildScripts:
      - name: Embed AgenticGlow event helper
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          destination="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/bin"
          mkdir -p "$destination"
          cp "$BUILT_PRODUCTS_DIR/agenticglow-event" "$destination/agenticglow-event"
          chmod 755 "$destination/agenticglow-event"
      # Xcode's RegisterWithLaunchServices phase runs on every build, so a
      # local build can quietly become the only registered widget extension
      # and serve stale code to the desktop while every other check passes.
      # This surfaces that as a build warning instead of leaving it to be
      # noticed by hand. Advisory only: it never fails a build, and it is a
      # no-op wherever AgenticGlow is not installed, including CI.
      - name: Check installed widget registration
        basedOnDependencyAnalysis: false
        script: |
          set -uo pipefail
          if [ ! -d "/Applications/AgenticGlow.app" ]; then
            exit 0
          fi
          output="$("$SRCROOT/Scripts/verify-widget-registration.sh" 2>&1)" || {
            echo "warning: the installed AgenticGlow widget registration is wrong."
            printf '%s\n' "$output" | while IFS= read -r line; do
              echo "warning: $line"
            done
            exit 0
          }
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twodamax.agenticglow
        PRODUCT_NAME: AgenticGlow
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        REGISTER_APP_GROUPS: YES
      configs:
        Debug:
          DEVELOPMENT_TEAM: Z52AX2BH7T
  # iOS. The same Core sources compile into a second framework with the
  # same module name, so the widget views import AgenticGlowCore on both
  # platforms unchanged. The file list is the platform-neutral subset:
  # the widget snapshot model and semantics, the session and work rules
  # the snapshot builder relies on, and synchronization. Process
  # inspection, hook installation, Keychain, and provider adapters stay
  # macOS-only. A new Core file the widget needs is added here; the iOS
  # build fails loudly if one is missed.
  AgenticGlowCoreiOS:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/AgenticGlowCore/Widget
      - path: Sources/AgenticGlowCore/Sync
      - path: Sources/AgenticGlowCore/Work
      - path: Sources/AgenticGlowCore/Events/AgentProvider.swift
      - path: Sources/AgenticGlowCore/Events/ToolCategory.swift
      - path: Sources/AgenticGlowCore/Events/JSONCoding.swift
      - path: Sources/AgenticGlowCore/Events/NormalizedEvent.swift
      - path: Sources/AgenticGlowCore/Events/HookEventKind.swift
      # Allowance is listed file by file rather than as a directory,
      # unlike Widget/Sync/Work above. The adapters in it hold the
      # provider credentials and make the network calls, and none of that
      # belongs on the phone, which only ever reads a snapshot the Mac
      # published. A new file here is not in the iOS build until it is
      # named on this list.
      - path: Sources/AgenticGlowCore/Allowance/AllowanceWarning.swift
      - path: Sources/AgenticGlowCore/Allowance/ProviderAllowance.swift
      - path: Sources/AgenticGlowCore/Allowance/AllowancePool.swift
      - path: Sources/AgenticGlowCore/Allowance/AllowanceWindowRollover.swift
      - path: Sources/AgenticGlowCore/State/SessionKey.swift
      - path: Sources/AgenticGlowCore/State/SessionResolver.swift
      - path: Sources/AgenticGlowCore/State/SessionSnapshot.swift
      - path: Sources/AgenticGlowCore/State/SessionVisibilityPolicy.swift
      - path: Sources/AgenticGlowCore/Product/ProductMetadata.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twodamax.agenticglow.ios.core
        PRODUCT_NAME: AgenticGlowCore
        PRODUCT_MODULE_NAME: AgenticGlowCore
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES
        MACH_O_TYPE: staticlib
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        TARGETED_DEVICE_FAMILY: "1"
  AgenticGlowWidgetiOS:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    # The same view, intent, and provider sources as the desktop widget.
    sources:
      - Sources/AgenticGlowWidget
    info:
      path: Config/AgenticGlowWidgetiOS-Info.plist
      properties:
        CFBundleDisplayName: AgenticGlow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: Copyright © 2026 AgenticGlow contributors
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/AgenticGlowWidgetiOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.twodamax.agenticglow
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.twodamax.agenticglow
        com.apple.developer.icloud-services:
          - CloudKit
    dependencies:
      - target: AgenticGlowCoreiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twodamax.agenticglow.ios.widget
        PRODUCT_NAME: AgenticGlowWidgetiOS
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Z52AX2BH7T
  AgenticGlowiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/AgenticGlowiOS
    resources:
      - Sources/AgenticGlowiOS/Resources
    info:
      path: Config/AgenticGlowiOS-Info.plist
      properties:
        CFBundleDisplayName: AgenticGlow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: Copyright © 2026 AgenticGlow contributors
        # Only Apple's CloudKit transport security; no encryption of the
        # app's own, so the export-compliance question is answered here.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Silent CloudKit pushes when the Mac publishes. Apple's push
        # service on CloudKit's behalf; no AgenticGlow server exists.
        UIBackgroundModes:
          - remote-notification
        CFBundleURLTypes:
          - CFBundleURLName: com.twodamax.agenticglow.ios
            CFBundleURLSchemes:
              - agenticglow
    entitlements:
      path: Config/AgenticGlowiOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.twodamax.agenticglow
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.twodamax.agenticglow
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
    dependencies:
      - target: AgenticGlowCoreiOS
      - target: AgenticGlowWidgetiOS
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twodamax.agenticglow.ios
        PRODUCT_NAME: AgenticGlow
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        TARGETED_DEVICE_FAMILY: "1"
        # iOS ships through Xcode's own signing (archive and export), not
        # the Mac's manual Developer ID pipeline, so both configurations
        # sign automatically for the team.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Z52AX2BH7T
  AgenticGlowCoreTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Tests/AgenticGlowCoreTests
      - Tests/TestSupport
      - Tests/Fixtures
    dependencies:
      - target: AgenticGlowCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twodamax.agenticglow.core-tests
        GENERATE_INFOPLIST_FILE: YES
  AgenticGlowEventTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Tests/AgenticGlowEventTests
      - Tests/TestSupport
      - Tests/Fixtures
    dependencies:
      - target: AgenticGlowCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twodamax.agenticglow.event-tests
        GENERATE_INFOPLIST_FILE: YES
  AgenticGlowWidgetTests:
    # Compiles the extension's sources directly (minus its @main bundle) so
    # the real timeline provider and entry mapping run under XCTest. The
    # .appex itself cannot host a test bundle.
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Tests/AgenticGlowWidgetTests
      - path: Sources/AgenticGlowWidget
        excludes:
          - AgenticGlowWidgetBundle.swift
    dependencies:
      - target: AgenticGlowCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twodamax.agenticglow.widget-tests
        GENERATE_INFOPLIST_FILE: YES
  AgenticGlowAppTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Tests/AgenticGlowAppTests
      - Tests/TestSupport
    dependencies:
      - target: AgenticGlow
      - target: AgenticGlowCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twodamax.agenticglow.app-tests
        GENERATE_INFOPLIST_FILE: YES
  AgenticGlowUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Tests/AgenticGlowUITests
    dependencies:
      - target: AgenticGlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twodamax.agenticglow.ui-tests
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
schemes:
  AgenticGlow:
    build:
      targets:
        AgenticGlow: all
        AgenticGlowCoreTests: [test]
        AgenticGlowEventTests: [test]
        AgenticGlowWidgetTests: [test]
        AgenticGlowAppTests: [test]
        AgenticGlowUITests: [test]
    test:
      targets:
        - AgenticGlowCoreTests
        - AgenticGlowEventTests
        - AgenticGlowWidgetTests
        - AgenticGlowAppTests
        - AgenticGlowUITests
  AgenticGlowEvent:
    build:
      targets:
        AgenticGlowEvent: all
        AgenticGlowEventTests: [test]
    test:
      targets:
        - AgenticGlowEventTests
  AgenticGlowiOS:
    build:
      targets:
        AgenticGlowiOS: all
